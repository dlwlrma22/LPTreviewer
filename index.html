  <script id="melvinSession20Data" type="application/json">{"bank":"Melvin Session 20 - ProfEd and GenEd","prefix":"melvin-s20","items":[["Philippine History","According to the session, which principle was identified as uniquely enshrined in the Philippine Constitution compared with other constitutions?",["Brotherhood","Freedom","Peace","Love"],3,"The session identifies \u0027love\u0027 as the unique principle being asked for in this drill."],["Learners and Learning Principles","In the separated-twins example, which finding did the session emphasize?",["Environment shapes a person\u0027s character","Heredity alone determines behavior","Parents are the only source of values","Behavior is unrelated to surroundings"],0,"The session uses the twins\u0027 different behavior to emphasize the influence of the environment on character."],["Learners and Learning Principles","How did the session distinguish inculturation from acculturation?",["Inculturation is culture learned inside the family; acculturation is culture learned from outside","Inculturation is formal schooling; acculturation is home learning","Inculturation is loss of culture; acculturation is isolation","They were presented as exactly the same process"],0,"The session describes inculturation as culture learned within the home or family and acculturation as culture learned from outside."],["Teaching Profession","Which educational system was associated in the session with social discipline and social etiquette?",["Saracenic education","Chivalric education","Platonic education","Confucian education"],1,"The session associates chivalric education with social discipline and social etiquette."],["Curriculum, Methods, and Technology","Which pair was identified as appropriate for asynchronous communication with students?",["Chat and instant messaging","Video conferencing and chat","Electronic bulletin board and email","Video conferencing and instant messaging"],2,"The session treats an electronic bulletin board and email as asynchronous because participants do not need to be online at the same time."],["Arts and Humanities","Who was identified in the session as the first Filipino painter recognized as a National Artist?",["Juan Luna","Kidlat Tahimik","Fernando Z\u00f3bel","Fernando Amorsolo"],3,"The session identifies Fernando Amorsolo as the first Filipino painter recognized as a National Artist."],["The Contemporary World","Which economic theory was associated with population increasing geometrically while food supply does not increase as fast?",["Machiavellian theory","Supply-and-demand theory","Malthusian theory","Socialism"],2,"The session identifies this population-and-food-supply idea as Malthusian."],["The Contemporary World","According to the session, what relationship exists between price and quantity supplied under the law of supply?",["Direct relationship","Inverse relationship","No relationship","Random relationship"],0,"The session states that when price rises, supply also rises, describing a direct relationship."],["The Contemporary World","According to the session, what usually happens to demand when price rises?",["Demand rises","Demand falls","Demand stays fixed","Demand becomes supply"],1,"The session describes the law of demand as an inverse relationship: when price rises, demand falls."],["Learners and Learning Principles","In the four-stage coping sequence discussed for families learning of a child\u0027s condition, what is the second stage?",["Shock or denial","Anger or blaming others","Depression or bargaining","Acceptance"],1,"The session gives the sequence as shock/denial, anger, depression, and acceptance; blaming others is linked to the anger stage."],["Curriculum, Methods, and Technology","Which strategy was identified as best for presenting a specific historical scene using motionless figures?",["Buzz session","Carousel discussion","Graffiti wall","Tableau"],3,"The session defines tableau as a group of motionless figures representing a scene from a story or history."],["Curriculum, Methods, and Technology","What did the session mean by integrative teaching?",["Using only one subdiscipline","Combining two subject disciplines","Transferring only textbook skills to real life","Separating all subjects completely"],1,"The session describes integrative teaching as combining or inserting one subject discipline into another."],["Curriculum, Methods, and Technology","Which curriculum approach was associated with transferring skills learned from books to real-life situations?",["Intradisciplinary","Multidisciplinary","Transdisciplinary","Isolated-disciplinary"],2,"The session repeatedly associates transdisciplinary learning with transferring learned skills to real life."],["Teaching Profession","In the session\u0027s discussion of inclusivity under the Enhanced Basic Education Act, what does inclusivity mean?",["Teaching only learners without disabilities together","Teaching only learners with disabilities together","Welcoming learners with and without disabilities in the same classroom","Making every requirement identical regardless of learner need"],2,"The session explains inclusive education as welcoming learners with and without disabilities together."],["Assessment of Learning","How did the session describe formative assessment?",["Assessment only after final instruction","Assessment for learning that occurs before and during instruction","Assessment used only for ranking students","Assessment used as punishment"],1,"The session identifies formative assessment as assessment for learning that occurs before and during instruction."],["Assessment of Learning","Which situation was identified as NOT formative assessment in the session?",["Asking questions while discussion is ongoing","Giving a short test to find lessons students do not understand","Giving a short quiz after instruction to determine the outcome of instruction","Administering a readiness test to incoming students"],2,"The session treats determining the out     document.querySelector('#palette').innerHTML=pageThemes.map(theme=>`<button class="theme-card" data-theme="${theme.key}" aria-label="Use ${theme.name} page theme"><span class="theme-preview" aria-hidden="true">${theme.colors.map(color=>`<i style="background:${color}"></i>`).join('')}</span><span>${theme.name}</span></button>`).join('');document.querySelectorAll('.theme-card').forEach(card=>card.onclick=()=>setPageTheme(card.dataset.theme));customColor.oninput=e=>setAccent(e.target.value);document.documentElement.dataset.palette=currentPageTheme;markTheme();customColor.value=currentAccent||getComputedStyle(document.documentElement).getPropertyValue('--teal').trim();if(currentAccent)setAccent(currentAccent);
    appearanceButton.onclick=e=>{e.stopPropagation();const open=appearance.classList.toggle('open');appearanceButton.classList.toggle('active',open);appearanceButton.setAttribute('aria-expanded',String(open))};appearance.onclick=e=>e.stopPropagation();document.addEventListener('click',()=>{appearance.classList.remove('open');appearanceButton.classList.remove('active');appearanceButton.setAttribute('aria-expanded','false')});
    document.querySelector('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('lept-theme',t);document.querySelector('#theme').textContent=t==='light'?'☾':'☀';if(!currentAccent)customColor.value=getComputedStyle(document.documentElement).getPropertyValue('--teal').trim()};document.querySelector('#theme').textContent=document.documentElement.dataset.theme==='light'?'☾':'☀';
    document.querySelector('#reset').onclick=()=>{if(confirm('Clear all saved answers and flags?')){state.progress={};state.flags={};state.orders={};save('lept-progress-v1',{});save('lept-flags-v1',{});apply()}};
    document.addEventListener('keydown',e=>{if(document.activeElement===search)return;if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else{let n=/^[a-d]$/i.test(e.key)?e.key.toLowerCase().charCodeAt(0)-97:/^[1-4]$/.test(e.key)?Number(e.key)-1:-1;if(n>=0&&state.visible[state.index]){const q=state.visible[state.index],ord=order(q);answer(q,ord[n])}}});
    apply();
  })();
  </script>
</body>
</html>
